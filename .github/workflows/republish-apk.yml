name: APK erneut veröffentlichen

# Nimmt die APK eines bereits gelaufenen Builds und legt sie im öffentlichen
# Repository ab - ohne neu zu bauen.
#
# Wozu: Ein vollständiger Build dauert rund fünfzehn Minuten. Wenn nur die
# Veröffentlichung schiefging oder nachgeholt werden soll (etwa weil das
# Token erst später hinterlegt wurde), ist ein Neubau reine Zeitverschwendung -
# das Ergebnis liegt ja bereits als Artefakt vor.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Lauf-ID des Builds (leer = letzter erfolgreicher Lauf)'
        required: false
        type: string

permissions:
  contents: read
  # Wird gebraucht, um die Artefakte fremder Läufe herunterzuladen.
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      PUBLIC_RELEASE_REPO: ${{ vars.PUBLIC_RELEASE_REPO || 'neunelfer-sketch/9elf-Player' }}

    steps:
      - name: APK aus dem Build-Artefakt holen
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="${{ inputs.run_id }}"
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --repo "${{ github.repository }}" \
              --workflow build-apk.yml --status success --limit 1 \
              --json databaseId --jq '.[0].databaseId')
          fi
          echo "Verwende Lauf $RUN_ID"

          # gh legt jedes Artefakt in einen eigenen Unterordner - die APKs
          # werden anschließend flach nach out/ gezogen.
          gh run download "$RUN_ID" --repo "${{ github.repository }}" --dir raw
          mkdir -p out
          find raw -name '*.apk' -exec cp {} out/ \;
          ls -lh out/

          VERSION=$(ls out/ | grep -oE '^9elf-Player-v[0-9]+\.[0-9]+\.[0-9]+\.apk$' \
            | head -1 | sed -E 's/^9elf-Player-(v[0-9.]+)\.apk$/\1/')
          if [ -z "$VERSION" ]; then
            echo "Keine versionierte APK im Artefakt gefunden." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Gefundene Version: $VERSION"

      - name: Prüfen, ob das Token hinterlegt ist
        run: |
          if [ -z "${RELEASE_TOKEN:-}" ]; then
            echo "::error::Das Secret RELEASE_TOKEN fehlt. Es gehört in dieses" \
                 "private Repository unter Settings → Secrets and variables →" \
                 "Actions → Repository secrets."
            exit 1
          fi
          echo "RELEASE_TOKEN ist vorhanden."

      - name: APK ins öffentliche Repo veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.fetch.outputs.version }}"
          # Nur die fertige APK, nicht der Debug-Build.
          FILES=("out/9elf-Player-$VERSION.apk")
          [ -f "out/9elf-Player-latest.apk" ] && FILES+=("out/9elf-Player-latest.apk")

          echo "Veröffentliche ${FILES[*]} in $PUBLIC_RELEASE_REPO"
          gh release create "$VERSION" "${FILES[@]}" \
            --repo "$PUBLIC_RELEASE_REPO" \
            --title "9elf Player $VERSION" \
            --notes "Testbuild für Android TV und Fire TV.

          **Installation auf dem Fire TV Stick**

          1. Einstellungen → *Mein Fire TV* → *Entwickleroptionen* → Installation
             unbekannter Apps für *Downloader* erlauben.
          2. In der App *Downloader* diese Adresse eingeben – sie bleibt für alle
             künftigen Versionen gleich:
             \`github.com/$PUBLIC_RELEASE_REPO/releases/latest/download/9elf-Player-latest.apk\`
          3. Nach dem Laden auf *Installieren* gehen.

          Signiert mit einem öffentlichen Testschlüssel, nicht mit einem
          Veröffentlichungsschlüssel." \
            || gh release upload "$VERSION" "${FILES[@]}" \
                 --repo "$PUBLIC_RELEASE_REPO" --clobber

          echo "### APK veröffentlicht" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$PUBLIC_RELEASE_REPO/releases/latest/download/9elf-Player-latest.apk" >> "$GITHUB_STEP_SUMMARY"

name: APK bauen

# Baut die App und hängt die fertigen APKs an ein GitHub-Release, sodass
# sie direkt auf dem Fire TV Stick heruntergeladen werden können.
on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  # Wird gebraucht, um das Release anzulegen und die APKs anzuhängen.
  contents: write

concurrency:
  # Ein neuer Push macht einen noch laufenden Build überflüssig.
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Muss auf Job-Ebene stehen: in der "if"-Bedingung eines Schritts ist
      # dessen eigenes env noch nicht sichtbar.
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      # Ziel für die öffentlichen Testbuilds. Über eine Repository-Variable
      # überschreibbar, falls das Repo mal anders heißt.
      PUBLIC_RELEASE_REPO: ${{ vars.PUBLIC_RELEASE_REPO || 'neunelfer-sketch/9elf-player-releases' }}

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      # Tests und beide APKs in einem Gradle-Aufruf: das spart die
      # Konfigurationsphase zweimal. Die Ausgabe wird mitgeschrieben, damit
      # der Schritt darunter im Fehlerfall die Compiler-Meldungen
      # herausfiltern kann.
      #
      # Bewusst ohne --stacktrace: der Gradle-Stacktrace ist mehrere hundert
      # Zeilen lang und verdrängt genau die "e:"-Zeilen, auf die es ankommt.
      - name: Testen und APKs bauen
        run: |
          set -o pipefail
          ./gradlew test assembleDebug assembleRelease 2>&1 | tee /tmp/build.log

      # Läuft nur bei einem Fehlschlag und hebt die eigentlichen Meldungen
      # ans Ende des Protokolls, wo sie ohne Scrollen zu finden sind.
      - name: Kompilierfehler zusammenfassen
        if: failure()
        run: |
          echo "===================== Kompilierfehler ====================="
          grep -E "^e: |^error: |^w: .*\(error\)|Unresolved reference|Type mismatch" /tmp/build.log \
            | head -100 || echo "(keine Compiler-Meldungen gefunden)"
          echo "==========================================================="
          echo "--- letzte Gradle-Zusammenfassung ---"
          grep -E "^\* What went wrong|^> |FAILURE:|BUILD FAILED" /tmp/build.log | head -40 || true

      # Die Dateinamen bekommen die Build-Nummer, damit im Download-Ordner
      # des Sticks erkennbar bleibt, welche Version welche ist.
      - name: APKs umbenennen
        id: rename
        run: |
          mkdir -p out
          VERSION="v1.0.${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "out/9elf-Player-$VERSION.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "out/9elf-Player-$VERSION-debug.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -lh out/

      - name: APKs als Workflow-Artefakt sichern
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.rename.outputs.version }}
          path: out/*.apk
          retention-days: 30

      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.rename.outputs.version }}"
          # --clobber überschreibt die Dateien, falls das Tag schon existiert.
          gh release create "$VERSION" out/*.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "9elf Player $VERSION" \
            --notes "Testbuild vom Branch \`${{ github.ref_name }}\`.

          **Zum Installieren auf dem Fire TV Stick**

          1. In den Einstellungen unter *Mein Fire TV → Entwickleroptionen* die
             Installation unbekannter Apps für den Downloader erlauben.
          2. Die App *Downloader* öffnen und die URL der Datei
             \`9elf-Player-$VERSION.apk\` von dieser Seite eingeben.
          3. Nach dem Download auf *Installieren* gehen.

          \`9elf-Player-$VERSION.apk\` ist der optimierte Build – den nehmen.
          \`…-debug.apk\` ist nur für die Fehlersuche gedacht und läuft langsamer.

          Beide sind mit einem öffentlichen Testschlüssel signiert, nicht mit
          einem Veröffentlichungsschlüssel." \
            || gh release upload "$VERSION" out/*.apk --repo "${{ github.repository }}" --clobber

      # Der Quellcode liegt in einem privaten Repository; dessen
      # Release-Dateien sind nicht ohne Anmeldung abrufbar, und die
      # Downloader-App auf dem Fire TV kann sich nicht anmelden. Deshalb
      # landen die APKs zusätzlich in einem öffentlichen Repository, das
      # ausschließlich die Builds enthält.
      #
      # Läuft nur, wenn RELEASE_TOKEN hinterlegt ist, und darf fehlschlagen,
      # ohne den Build rot zu färben - die APKs liegen dann immer noch hier.
      - name: APKs ins öffentliche Repo spiegeln
        if: env.RELEASE_TOKEN != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          VERSION="${{ steps.rename.outputs.version }}"
          echo "Spiegele nach $PUBLIC_RELEASE_REPO ..."
          gh release create "$VERSION" out/*.apk \
            --repo "$PUBLIC_RELEASE_REPO" \
            --title "9elf Player $VERSION" \
            --notes "Testbuild für Android TV und Fire TV.

          **Installation auf dem Fire TV Stick**

          1. Einstellungen → *Mein Fire TV* → *Entwickleroptionen* → Installation
             unbekannter Apps für *Downloader* erlauben.
          2. In der App *Downloader* die Adresse dieser Datei eingeben:
             \`9elf-Player-$VERSION.apk\`
          3. Nach dem Laden auf *Installieren* gehen.

          \`9elf-Player-$VERSION.apk\` ist der optimierte Build – den nehmen.
          \`…-debug.apk\` dient nur der Fehlersuche und läuft langsamer.

          Signiert mit einem öffentlichen Testschlüssel, nicht mit einem
          Veröffentlichungsschlüssel." \
            || gh release upload "$VERSION" out/*.apk --repo "$PUBLIC_RELEASE_REPO" --clobber

      - name: Download-Adresse ausgeben
        run: |
          echo "### APK fertig :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Privat: https://github.com/${{ github.repository }}/releases/tag/${{ steps.rename.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "$RELEASE_TOKEN" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Öffentlich (direkt auf dem Stick ladbar):" >> $GITHUB_STEP_SUMMARY
            echo "https://github.com/$PUBLIC_RELEASE_REPO/releases/download/${{ steps.rename.outputs.version }}/9elf-Player-${{ steps.rename.outputs.version }}.apk" >> $GITHUB_STEP_SUMMARY
          fi
